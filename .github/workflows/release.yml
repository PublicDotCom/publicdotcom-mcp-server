name: release

# Runs on every push to main (i.e. every merged PR). It only cuts a release
# when pyproject.toml's version is one that hasn't been released yet (no
# matching v<version> git tag). Merges that don't bump the version are no-ops,
# which is required because PyPI permanently rejects re-uploading a version.
#
# Nothing publishes unless the full test matrix and lint pass first — see the
# verify job. Note that this gate does not remove the need for branch protection
# on main: it stops a broken publish, not a broken merge.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ci.yml also runs these, but `needs:` cannot reference another workflow, and a
  # publish to PyPI is unfixable — the version is burned even if the upload was a
  # mistake. So the release path verifies for itself rather than trusting that a
  # green CI run happened alongside it.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: pip install ruff
      - run: ruff check .

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # create the git tag + GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full tag history to detect existing releases

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: ver
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        run: |
          if git rev-parse "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ steps.ver.outputs.version }} already tagged — skipping release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v${{ steps.ver.outputs.version }}."
          fi

      - name: Build sdist and wheel
        if: success() && steps.check.outputs.new == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: success() && steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: success() && steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
