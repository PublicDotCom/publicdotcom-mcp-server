name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scopes the PyPI Trusted Publisher to this environment and enables
    # optional approval gating (configure under Settings > Environments).
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — lets the job mint a
      # short-lived identity token instead of using a stored API token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
